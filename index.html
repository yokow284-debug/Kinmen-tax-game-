  
    <!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>發票存雲端．金門e化互動遊戲</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(135deg, #fff8df, #dff5ff);
      color: #333;
    }
    .card {
      width: min(92%, 620px); padding: 40px 25px;
      background: #ffffff; border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15); text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 6vw, 44px); color: #d35400; }
    .subtitle { margin-bottom: 30px; font-size: 22px; font-weight: bold; }
    button {
      padding: 16px 38px; border: 0; border-radius: 50px;
      background: #087f5b; color: #ffffff; font-size: 24px; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #066b4d; }
    #result {
      display: none; margin-top: 28px; padding: 20px;
      border-radius: 16px; background: #fff3bf; font-size: 25px; font-weight: bold;
    }
    #goButton { display: none; margin-top: 18px; background: #1971c2; }
    .notice { margin-top: 25px; font-size: 16px; color: #666; }
  </style>
</head>
<body>
  <main class="card">
    <h1>發票存雲端．金門e化互動遊戲</h1>
    <div class="subtitle">租稅宣導活動</div>
    <button id="drawButton" type="button">開始抽題</button> 
    <div id="result"></div>
    <button id="goButton" type="button">前往做答</button>
    <div class="notice">請按「開始抽題」，系統將隨機抽出一個主題。</div>
  </main>
  <script>
    const forms = [
      "https://docs.google.com/forms/d/1uMYk7SqLIgChX7iixLyfQB8TYCYl0s2az8cRgs-JJUY/edit", 
      "https://docs.google.com/forms/d/1GExvo5tsiER1oMqc-1q3J6qVNWCilc9y7plRJ8okQsk/edit"
    ];
    const drawButton = document.getElementById("drawButton");
    const result = document.getElementById("result");
    const goButton = document.getElementById("goButton");
    let chosenUrl = "";

    drawButton.addEventListener("click", function () {
      const randomIndex = Math.floor(Math.random() * forms.length);
      chosenUrl = forms[randomIndex];
      result.textContent = "已隨機分配好題目！";
      result.style.display = "block";
      goButton.style.display = "inline-block";
      drawButton.disabled = true;
      drawButton.textContent = "抽題完成";
    });

    goButton.addEventListener("click", function () {
      if (chosenUrl) {
        window.location.href = chosenUrl;
      }
    });
  </script>
</body>
</html>
