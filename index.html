<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>發票存雲端・金門e化互動遊戲</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #8B2500;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 25px;
        }
        .btn-primary {
            background-color: #1e4620;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .btn-primary:hover {
            background-color: #2e6930;
        }
        .result-box {
            background-color: #fef9e7;
            border: 1px solid #f9e79f;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 18px;
            color: #7d6608;
            font-weight: bold;
        }
        .btn-link {
            display: inline-block;
            background-color: #1b4f72;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
        }
        .btn-link:hover {
            background-color: #21618c;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>發票存雲端・金門e化互動遊戲</h1>
        <p>租稅宣導活動</p>
        
        <button id="drawBtn" class="btn-primary" onclick="drawQuestion()">開始抽題</button>

        <div id="resultContainer" class="hidden">
            <div id="resultText" class="result-box">本次抽到的題目</div>
            <a id="quizLink" href="https://docs.google.com/forms/d/1GExvo5tsiER1oMqc-1q3J6qVNWCilc9y7plRJ8okQsk/viewform" target="_blank" class="btn-link">前往做答</a>
        </div>
    </div>

    <script>
        // 隨機抽題的項目
        const topics = [
            "金門在地租稅",
            "雲端發票知識（A卷）",
            "雲端發票知識（B卷）"
        ];

        function drawQuestion() {
            // 隨機抽出一項
            const randomIndex = Math.floor(Math.random() * topics.length);
            const selectedTopic = topics[randomIndex];

            // 顯示結果
            document.getElementById("resultText").innerText = "本次抽到：" + selectedTopic;
            
            // 變更按鈕文字為重新抽題
            const btn = document.getElementById("drawBtn");
            btn.innerText = "重新抽題";

            // 顯示結果區塊與正確的表單連結
            document.getElementById("resultContainer").classList.remove("hidden");
        }
    </script>

</body>
</html>
