<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>發票存雲端．金門e化互動遊戲</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(135deg, #fff8df, #dff5ff);
      color: #333;
    }

    .card {
      width: min(92%, 620px);
      padding: 40px 25px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 6vw, 44px);
      color: #d35400;
    }

    .subtitle {
      margin-bottom: 30px;
      font-size: 22px;
      font-weight: bold;
    }

    button {
      padding: 16px 38px;
      border: 0;
      border-radius: 50px;
      background: #087f5b;
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #066b4d;
    }

    #result {
      display: none;
      margin-top: 28px;
      padding: 20px;
      border-radius: 16px;
      background: #fff3bf;
      font-size: 25px;
      font-weight: bold;
    }

    #goButton {
      display: none;
      margin-top: 18px;
      background: #1971c2;
    }

    .notice {
      margin-top: 25px;
      font-size: 16px;
      color: #666;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>發票存雲端．金門e化互動遊戲</h1>
    <div class="subtitle">租稅宣導活動</div>

    <button id="drawButton" type="button">開始抽題</button>

    <div id="result"></div>
    <button id="goButton" type="button">前往作答</button>

    <div class="notice">請按「開始抽題」，系統將隨機抽出一個主題。</div>
  </main>

  <script>
    const topics = [
      {
        name: "租稅知識",
        url: "請在此貼上租稅知識表單網址"
      },
      {
        name: "雲端發票",
        url: "請在此貼上雲端發票表單網址"
      },
      {
        name: "金門在地租稅",
        url: "請在此貼上金門在地租稅表單網址"
      },
      {
        name: "性別平等",
        url: "請在此貼上性別平等表單網址"
      },
      {
        name: "165反詐騙",
        url: "請在此貼上165反詐騙表單網址"
      },
      {
        name: "納稅者權利保護",
        url: "請在此貼上納稅者權利保護表單網址"
      }
    ];

    let selectedTopic = null;

    const drawButton = document.getElementById("drawButton");
    const result = document.getElementById("result");
    const goButton = document.getElementById("goButton");

    drawButton.addEventListener("click", function () {
      const randomIndex = Math.floor(Math.random() * topics.length);
      selectedTopic = topics[randomIndex];

      result.textContent = "本次抽到：" + selectedTopic.name;
      result.style.display = "block";
      goButton.style.display = "inline-block";
      drawButton.disabled = true;
      drawButton.textContent = "抽題完成";
    });

    goButton.addEventListener("click", function () {
      if (!selectedTopic) return;

      if (selectedTopic.url.startsWith("請在此")) {
        alert("尚未設定此主題的 Google 表單網址。");
        return;
      }

      window.location.href = selectedTopic.url;
    });
  </script>
</body>
</html>
